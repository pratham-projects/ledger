    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- The bar is dark before React paints. Without this the browser draws its own white

    <title>Ledger — one line in, a picture out (demo)</title>

      name="description"
      content="Portfolio demo: pick a model and a LoRA, then send one line into image, video, chat, RPG or story. Sample data, no backend."
    />

    <!-- Shared cards. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Ledger" />
    <meta property="og:title" content="Ledger — one line in, a picture out (demo)" />
    <meta
      property="og:description"
      content="Portfolio demo: pick a model and a LoRA, then send one line into image, video, chat, RPG or story. Sample data, no backend."
    />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Ledger — one line in, a picture out (demo)" />
    <meta
      name="twitter:description"
      content="Portfolio demo: pick a model and a LoRA, then send one line into image, video, chat, RPG or story. Sample data, no backend."
    />
